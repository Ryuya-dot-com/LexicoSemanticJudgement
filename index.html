<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短文意味判断課題 (LJT)</title>
  <style>
    @font-face {
      font-family: 'Noto Sans JP';
      src: url('fonts/static/NotoSansJP-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    main {
      width: min(960px, 90vw);
      padding: 32px clamp(16px, 4vw, 48px);
      background: rgba(24, 24, 24, 0.9);
      border: 1px solid #333;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-size: clamp(28px, 4vw, 42px);
      margin: 0 0 16px;
      text-align: center;
      letter-spacing: 0.08em;
    }
    .screen {
      display: none;
      gap: 24px;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 240ms ease;
    }
    .screen.active {
      display: flex;
    }
    #stage {
      min-height: clamp(400px, 50vh, 560px);
      width: 100%;
      align-items: center;
      justify-content: center;
    }
    #stageContent {
      font-size: clamp(48px, 8vw, 96px);
      letter-spacing: 0.12em;
      white-space: pre-line;
    }
    #stageContent.small {
      font-size: clamp(28px, 3.2vw, 40px);
      letter-spacing: 0.06em;
    }
    p {
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.6;
      margin: 0;
      white-space: pre-line;
    }
    label {
      font-size: clamp(18px, 2vw, 24px);
      margin-bottom: 8px;
    }
    input[type="text"] {
      padding: 14px 18px;
      font-size: clamp(20px, 2.4vw, 26px);
      border-radius: 10px;
      border: 2px solid #555;
      width: min(420px, 84vw);
      background: #111;
      color: #fff;
      text-align: center;
      letter-spacing: 0.05em;
    }
    button {
      cursor: pointer;
      padding: 14px 28px;
      font-size: clamp(18px, 2.2vw, 24px);
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #1e90ff, #00bcd4);
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.08em;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(30, 144, 255, 0.35);
    }
    .mono {
      font-family: 'Roboto Mono', 'SFMono-Regular', 'Menlo', 'Noto Sans Mono', monospace;
    }
    .feedback {
      font-size: clamp(40px, 6vw, 70px);
      font-weight: 700;
      margin-top: 40px;
    }
    .feedback.correct {
      color: #27ae60;
    }
    .feedback.incorrect {
      color: #e74c3c;
    }
    #log {
      width: 100%;
      text-align: left;
      font-size: 16px;
      line-height: 1.4;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <section id="welcome" class="screen active">
      <h1>短文意味判断課題 (LJT)</h1>
      <p>研究参加ありがとうございます。<br>下の入力欄に参加者IDを入力し、「準備開始」ボタンを押してください。</p>
      <label for="participantId">参加者ID</label>
      <input id="participantId" type="text" autocomplete="off" maxlength="32" placeholder="例: LJT001">
      <button id="startButton" disabled>準備開始</button>
      <p class="mono">※ 音声を再生するため、最初にブラウザの音量を確認してください。</p>
    </section>

    <section id="instructions" class="screen">
      <h1>実施手順</h1>
      <p id="instructionText"></p>
      <button id="instructionNext">進む</button>
    </section>

    <section id="stage" class="screen">
      <div id="stageContent"></div>
    </section>

    <section id="summary" class="screen">
      <h1>完了</h1>
      <p id="summaryText"></p>
      <button id="downloadResultsButton">結果CSVをダウンロード</button>
      <button id="downloadSummaryButton">SDTサマリーをダウンロード</button>
      <div id="log" hidden></div>
    </section>
  </main>

  <script src="script.js" type="module"></script>
</body>
</html>
